name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: Vendor/Mole/go.sum

      - name: Validate scripts
        run: |
          zsh -n scripts/build-app.sh
          bash -n Vendor/Mole/mole Vendor/Mole/mo Vendor/Mole/install.sh
          find Vendor/Mole/bin Vendor/Mole/lib -type f -name '*.sh' -exec bash -n {} +

      - name: Test native app
        run: swift test --scratch-path /tmp/mac-tidy-ci-swift

      - name: Test bundled engine
        working-directory: Vendor/Mole
        run: go test ./...
